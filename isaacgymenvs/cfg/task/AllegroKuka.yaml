defaults:
  - _self_
  - env: pose_reaching

name: AllegroKuka

physics_engine: ${..physics_engine}

env:
  subtask: ""

  # if given, will override the device setting in gym.
  numEnvs: ${resolve_default:8192,${...num_envs}}

  envSpacing: 1.2
  episodeLength: 600
  # enableCameraSensors: False  # Setting to True will significantly slow down the environment (about 50% FPS)
  enableCameraSensors: True  # Updated vec_task.py code to allow this to be True and still be fast, as long as enable_viewer_sync=False
                             # Thus, we can leave this on by default without sacrificing speed, just need to make sure that enable_viewer_sync=False
                             # And if we need to capture images, then we can set enable_viewer_sync=True
  enableDebugVis: False
  evalStats: False  # extra evaluation-time statistics

  clampAbsObservations: 10.0

  stiffnessScale: 1.0
  forceLimitScale: 1.0
  useRelativeControl: False
  dofSpeedScale: 10.0  # often set to 1.0
  handMovingAverage: 0.1  # often set to 0.1 or 1.0
  armMovingAverage: 0.1  # often set to 0.1 or 1.0
  dofSpeedScaleFinal: ${eval:"None"}  # often set to 1.0
  armMovingAverageFinal: ${eval:"None"}  # often set to 0.1
  handMovingAverageFinal: ${eval:"None"}  # often set to 0.1

  controlFrequencyInv: 1 # 60 Hz

  resetPositionNoiseX: 0.1
  resetPositionNoiseY: 0.1
  resetPositionNoiseZ: 0.02
  resetRotationNoise: 1.0
  resetDofPosRandomIntervalFingers: 0.1
  resetDofPosRandomIntervalArm: 0.1
  resetDofVelRandomInterval: 0.5

  # Random forces applied to the object
  forceScale: 2.0
  forceProbRange: [0.001, 0.1]
  forceDecay: 0.99
  forceDecayInterval: 0.08

  liftingRewScale: 20.0
  liftingBonus: 300.0
  liftingBonusThreshold: 0.15  # when the object is lifted this distance (in meters) above the table, the agent gets the lifting bonus
  keypointRewScale: 200.0
  distanceDeltaRewScale: 50.0
  reachGoalBonus: 1000.0
  kukaActionsPenaltyScale: 0.003
  allegroActionsPenaltyScale: 0.0003
  fallDistance: 0.24
  fallPenalty: 0.0

  privilegedActions: False
  privilegedActionsTorque: 0.02

  # Physics v1, pretty much default settings we used from the start of the project
  dofFriction: -1.0  # negative values are ignored and the default friction from URDF file is used

  # gain of PD controller (?)
  allegroStiffness: 5.0  # Used to be 40.0 and used to 4000.0
  kukaStiffness: 300.0  # Used to be 40.0

  allegroEffort: 0.35  # this is what was used in sim-to-real experiment. Motor torque in Newton*meters
  kukaEffort: [300, 300, 300, 300, 300, 300, 300]  # see Physics v2

  allegroDamping: 0.25  # Used to be 5.0 and used to 200.0
  kukaDamping: 20.0  # Used to be 5.0

  allegroArmature: 0
  kukaArmature: 0

  keypointScale: 1.5
  objectBaseSize: 0.05

  randomizeObjectDimensions: True
  withSmallCuboids: True
  withBigCuboids: True
  withSticks: True

  objectType: "block"
  observationType: "full_state"
  successTolerance: 0.075
  targetSuccessTolerance: 0.01
  toleranceCurriculumIncrement: 0.9  # multiplicative
  toleranceCurriculumInterval: 3000  # in env steps across all agents, with 8192 this is 3000 * 8192 = 24.6M env steps
  maxConsecutiveSuccesses: 50
  successSteps: 1  # how many steps we should be within the tolerance before we declare a success

  saveStates: False
  saveStatesFile: "rootTensorsDofStates.bin"

  loadInitialStates: False
  loadStatesFile: "rootTensorsDofStates.bin"

  goodResetBoundary: 0

  object_type: "scanned_hammer_1"
  use_fixed_set_of_goal_states: False
  use_fixed_init_object_pose: False

  use_hack_object_pos_offset: False
  hack_object_pos_offset: 0.05

  tyler_num_cuboids: 500
  tyler_num_cylinders: 500
  tyler_randomize_com: False

  record_data: False
  record_data_num_steps: 1000

  capture_video: True  # This will not work unless headless=False or enableCameraSensors=True, both make it slower

  # Assuming 60Hz, this takes a 10s video recording every 100s of simulation time
  # When training many envs in parallel, it runs roughly 4-10Hz real-time, so this is 6-15x slower than real-time
  # Thus, it records a video every 600-1500s (10-25 minutes) of real time
  capture_video_freq: 6_000
  capture_video_len: 600

  turn_off_extra_obs: False
  turn_off_extra_obs_slowly: False

  turn_off_palm_vel_obs: False
  turn_off_palm_vel_obs_slowly: False

  turn_off_object_vel_obs: False
  turn_off_object_vel_obs_slowly: False

  use_obs_dropout: False
  init_tyler_curriculum_scale: 0.0
  VISUALIZE_PD_TARGET_AS_BLUE_ROBOT: False
  withTableForceSensor: False
  curriculumSuccessRatio: 0.6
  resetWhenDropped: False

  # some pose_reaching_env specific settings
  use_green_robot: True
  sanity_check_controls: False

  asset:
    # Whis was the original kuka_allegro asset.
    # This URDF has some issues, i.e. weights of fingers are too high and the mass of the Allegro hand is too
    # high in general. But in turn this leads to smoother movements and better looking behaviors.
    # Additionally, collision shapes of fingertips are more primitive (just rough convex hulls), which
    # gives a bit more FPS.
    # kukaAllegro: "urdf/kuka_allegro_description/kuka_allegro_touch_sensor.urdf"
    # kukaAllegro: "urdf/kuka_allegro_description/iiwa14_real.urdf"
    # kukaAllegro: "urdf/kuka_allegro_description/iiwa14_right_sharpa.urdf"
    # kukaAllegro: "urdf/kuka_allegro_description/iiwa14_left_sharpa.urdf"
    kukaAllegro: "urdf/kuka_allegro_description/iiwa14_left_sharpa_adjusted_restricted.urdf"

    # This is the URDF which has more accurate collision shapes and weights.
    # I believe since the hand is much lighter, the policy has more control over the movement of both arm and
    # fingers which leads to faster training (better sample efficiency). But overall the resulting
    # behaviors look too fast and a bit unrealistic.
    # For sim-to-real experiments this needs to be addressed. Overall, v2 is a "Better" URDF, and it should not
    # lead to behaviors that would be worse for sim-to-real experiments. Most likely the problem is elsewhere,
    # for example the max torques might be too high, or the armature of the motors is too low.
    # The exercise of finding the right URDF and other parameters is left for the sim-to-real part of the project.
    # kukaAllegro: "urdf/kuka_allegro_description/kuka_allegro_v2.urdf"

    assetFileNameBlock: "urdf/objects/cube_multicolor.urdf"

task:
  randomize: False
  randomization_params:
    frequency: 720 # Define how many simulation steps between generating new randomizations

    observations:
        range: [0, .01]
        range_correlated: [0, .01]
        operation: "additive"
        distribution: "gaussian"
        schedule: "constant"  # turn on noise after `schedule_steps` num steps
        schedule_steps: 5000
    actions:
        range: [0., .01]
        range_correlated: [0., .01]
        operation: "additive"
        distribution: "gaussian"
        schedule: "linear"  # linearly interpolate between 0 randomization and full range
        schedule_steps: 5000
    sim_params:
      gravity:
        range: [0, 0.3]
        operation: "additive"
        distribution: "gaussian"

    actor_params:
      allegro:
        scale:
          range: [0.999, 1.001]
          operation: "scaling"
          distribution: "uniform"
          setup_only: True # Property will only be randomized once before simulation is started. See Domain Randomization Documentation for more info.
        color: True
        dof_properties:
          damping:
            range: [0.7, 1.3]
            operation: "scaling"
            distribution: "loguniform"
          stiffness:
            range: [0.7, 1.3]
            operation: "scaling"
            distribution: "loguniform"
          effort:
            range: [0.7, 1.3]
            operation: "scaling"
            distribution: "uniform"
          friction:
            range: [0.7, 1.3]
            operation: "scaling"
            distribution: "uniform"
          armature:
            range: [0.7, 1.3]
            operation: "scaling"
            distribution: "uniform"
          # lower:
          #   range: [-5.0, 5.0]
          #   operation: "additive"
          #   distribution: "uniform"
          # upper:
          #   range: [-5.0, 5.0]
          #   operation: "additive"
          #   distribution: "uniform"

        rigid_body_properties:
          mass:
            range: [0.7, 1.3] # change when runtime API is available
            operation: "scaling"
            distribution: "uniform"
            setup_only: True # Property will only be randomized once before simulation is started. See Domain Randomization Documentation for more info.

        rigid_shape_properties:
          friction:
            num_buckets: 100
            range: [0.7, 1.3]
            operation: "scaling"
            distribution: "uniform"
          restitution:
            num_buckets: 100
            range: [0.0, 0.3]
            operation: "additive"
            distribution: "uniform"
      object:
        scale:
          # range: [0.7, 1.3]
          range: [0.999, 1.001]
          operation: "scaling"
          distribution: "uniform"
          setup_only: True # Property will only be randomized once before simulation is started. See Domain Randomization Documentation for more info.
        rigid_body_properties:
          mass:
            range: [0.7, 1.3] # after fixing the API expand it even more
            operation: "scaling"
            distribution: "uniform"
            setup_only: True # Property will only be randomized once before simulation is started. See Domain Randomization Documentation for more info.
        rigid_shape_properties:
          friction:
            num_buckets: 100
            range: [0.7, 1.3]
            operation: "scaling"
            distribution: "uniform"
          restitution:
            num_buckets: 100
            range: [0.0, 0.3]
            operation: "additive"
            distribution: "uniform"

sim:
  substeps: 2
  dt: ${eval:"1/60"} # 1/60
  up_axis: "z"
  use_gpu_pipeline: ${eq:${...pipeline},"gpu"}
  num_client_threads: 8

  gravity: [0.0, 0.0, -9.81]
  physx:
    num_threads: 6
    solver_type: 1  # 0: pgs, 1: tgs
    num_position_iterations: 8
    # num_velocity_iterations: 8  # Consider trying with this
    num_velocity_iterations: 0

    max_gpu_contact_pairs: ${eval:"8*1024*1024"} # 8*1024*1024
    num_subscenes: ${....num_subscenes}
    # contact_offset: 0.02  # Consider trying with this
    contact_offset: 0.002
    rest_offset: 0.0
    bounce_threshold_velocity: 0.2
    max_depenetration_velocity: 1000.0
    default_buffer_size_multiplier: 25.0
    contact_collection: 0 # 0: CC_NEVER (don't collect contact info), 1: CC_LAST_SUBSTEP (collect only contacts on last substep), 2: CC_ALL_SUBSTEPS (broken - do not use!)
